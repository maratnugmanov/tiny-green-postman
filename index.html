<html>

<head>
    <title>GREEN API Calls Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 40px;
        }

        .container {
            display: flex;
            gap: 30px;
            max-width: 1000px;
            margin: auto;
        }

        .left {
            width: 350px;
            display: flex;
            flex-direction: column;
        }

        .right {
            flex: 1;
        }

        input,
        textarea,
        button {
            width: 100%;
            padding: 12px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }

        button {
            cursor: pointer;
            background: #2e8b57;
            color: white;
            border: none;
        }

        button:hover {
            opacity: .9;
        }

        #response {
            height: 500px;
        }

        .section {
            margin-bottom: 25px;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="left">
            <div class="section">
                <input id="idInstance" placeholder="idInstance">
                <input id="apiToken" placeholder="ApiTokenInstance">
                <button onclick="getSettings()">getSettings</button>
                <button onclick="getStateInstance()">getStateInstance</button>
            </div>
            <div class="section">
                <input id="phone" placeholder="77771234567">
                <textarea id="message" placeholder="Hello world"></textarea>
                <button onclick="sendMessage()">sendMessage</button>
            </div>
            <div class="section">
                <input id="filePhone" placeholder="77771234567">
                <input id="fileUrl" placeholder="https://example.com/file.jpg">
                <button onclick="sendFile()">sendFileByUrl</button>
            </div>
        </div>
        <div class="right">
            <h3>Ответ:</h3>
            <textarea readonly id="response"></textarea>
        </div>
    </div>
    <script>
        function getBaseData() {

            return {

                id: document.getElementById(
                    "idInstance"
                ).value,

                token: document.getElementById(
                    "apiToken"
                ).value

            }

        }

        function showResponse(data) {

            document.getElementById(
                "response"
            ).value =
                JSON.stringify(
                    data,
                    null,
                    2
                )

        }

        async function apiRequest(
            method,
            body = null
        ) {

            let data = getBaseData()

            let url =
                `https://api.green-api.com/waInstance${data.id}/${method}/${data.token}`

            try {

                let response = await fetch(
                    url,
                    {
                        method: "POST",
                        headers: {
                            "Content-Type":
                                "application/json"
                        },
                        body: body
                            ? JSON.stringify(body)
                            : null
                    }
                )

                let result =
                    await response.json()

                showResponse(result)

            }
            catch (error) {

                showResponse(error)

            }

        }

        async function getSettings() {

            let data = getBaseData()

            let url =
                `https://api.green-api.com/waInstance${data.id}/getSettings/${data.token}`

            let response =
                await fetch(url)

            let result =
                await response.json()

            showResponse(result)

        }

        async function getStateInstance() {

            let data = getBaseData()

            let url =
                `https://api.green-api.com/waInstance${data.id}/getStateInstance/${data.token}`

            let response =
                await fetch(url)

            let result =
                await response.json()

            showResponse(result)

        }

        function sendMessage() {

            let phone =
                document.getElementById(
                    "phone"
                ).value

            let text =
                document.getElementById(
                    "message"
                ).value

            apiRequest(
                "sendMessage",
                {
                    chatId:
                        phone + "@c.us",

                    message:
                        text
                }
            )

        }

        function sendFile() {

            let phone =
                document.getElementById(
                    "filePhone"
                ).value

            let url =
                document.getElementById(
                    "fileUrl"
                ).value

            apiRequest(
                "sendFileByUrl",
                {
                    chatId:
                        phone + "@c.us",

                    urlFile:
                        url,

                    fileName:
                        "file"
                }
            )

        }

    </script>

</body>

</html>
